[workspace]
resolver = "2"
members = ["crates/yara-worker", "crates/yara-wasm"]
# yara-wasm only makes sense for wasm32-unknown-emscripten (it is a staticlib
# whose ring ops are supplied by emcc's --js-library), so keep it out of the
# default set: bare `cargo build` / `test` / `clippy` stay native-only and
# unchanged. Build it explicitly with `wasm/build.sh` or `-p yara-wasm`.
default-members = ["crates/yara-worker"]

[workspace.package]
version = "0.4.2"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Query Farm LLC <hello@query.farm>"]
repository = "https://github.com/Query-farm/vgi-yara"

[workspace.dependencies]
# VGI Rust SDK (worker side), published on crates.io. vgi 0.51 speaks VGI
# protocol vgi.v3 / 3.3 (needs the haybarn 2.0 community vgi extension), pulls
# in vgi-rpc 0.32.4 and arrow 59 transitively, and requires rustc 1.97
# (workspace rust-version); keep arrow/vgi-rpc here in lockstep with vgi's pins
# so a single arrow/vgi-rpc resolves. It also provides the wasm
# `vgi::wasm_worker!` macro used by yara-wasm. Base (feature-less) so each
# target can opt in: the native build takes the SDK's real defaults (`sqlite` +
# `transport-http`), while the wasm build must NOT — tokio/mio/axum and bundled
# SQLite do not compile for wasm32, and the browser transport serves over a byte
# channel rather than HTTP.
vgi = { version = "0.51.1", default-features = false }
vgi-rpc = { version = "0.32.4", default-features = false, features = ["macros"] }
arrow-array = "59.2"
arrow-buffer = "59.2"
arrow-schema = "59.2"

# YARA-X — VirusTotal's official pure-Rust YARA rewrite (compiles rules + scans,
# NO native libyara/C dependency). Exact-pinned so a yara-x minor (which can
# raise its MSRV — 1.23 declares 1.95) is an explicit bump. License: BSD-3-Clause (the crate) over Apache/BSD/MIT deps.
#
# default-features are off (they drag in the heavy `vt`/`dotnet`/`macho`/`lnk`/
# `cuckoo`/`dex`/`crx` modules and proto codegen we don't need); we enable just
# the standard malware-rule modules so common rules (hash/pe/elf/math/…) compile.
yara-x = { version = "=1.23.0", default-features = false, features = [
    "constant-folding",
    "fast-regexp",
    "exact-atoms",
    "hash-module",
    "pe-module",
    "elf-module",
    "math-module",
    "string-module",
    "time-module",
    "console-module",
] }

[profile.release]
opt-level = 2
