[workspace]
resolver = "2"
members = ["crates/yara-worker"]

[workspace.package]
version = "0.3.0"
edition = "2021"
rust-version = "1.97"
license = "MIT"
authors = ["Query Farm LLC <hello@query.farm>"]
repository = "https://github.com/Query-farm/vgi-yara"

[workspace.dependencies]
# VGI Rust SDK (worker side), published on crates.io. vgi 0.50 speaks VGI
# protocol vgi.v3 / 3.2 (needs the haybarn 2.0 community vgi extension), pulls
# in vgi-rpc 0.32.3 and arrow 59 transitively, and requires rustc 1.97
# (workspace rust-version); keep arrow/vgi-rpc here in lockstep with vgi's pins
# so a single arrow/vgi-rpc resolves.
vgi = "0.50.0"
vgi-rpc = { version = "0.32.3", default-features = false, features = ["macros", "stream-codec"] }
arrow-array = "59.2"
arrow-buffer = "59.2"
arrow-schema = "59.2"

# YARA-X — VirusTotal's official pure-Rust YARA rewrite (compiles rules + scans,
# NO native libyara/C dependency). Exact-pinned so a yara-x minor (which can
# raise its MSRV — 1.23 declares 1.95) is an explicit bump. License: BSD-3-Clause (the crate) over Apache/BSD/MIT deps.
#
# default-features are off (they drag in the heavy `vt`/`dotnet`/`macho`/`lnk`/
# `cuckoo`/`dex`/`crx` modules and proto codegen we don't need); we enable just
# the standard malware-rule modules so common rules (hash/pe/elf/math/…) compile.
yara-x = { version = "=1.23.0", default-features = false, features = [
    "constant-folding",
    "fast-regexp",
    "exact-atoms",
    "hash-module",
    "pe-module",
    "elf-module",
    "math-module",
    "string-module",
    "time-module",
    "console-module",
] }

[profile.release]
opt-level = 2
