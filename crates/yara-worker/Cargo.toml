[package]
name = "yara-worker"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "VGI worker bringing YARA-X rule compilation and malware scanning to DuckDB over Apache Arrow"

[lib]
name = "yara_worker"
path = "src/lib.rs"

[[bin]]
name = "yara-worker"
path = "src/main.rs"

[dependencies]
arrow-array.workspace = true
arrow-buffer.workspace = true
arrow-schema.workspace = true
yara-x.workspace = true
log = "0.4"

# --- Native ---------------------------------------------------------------
# The SDK's full default features (vgi 0.51: `sqlite` + `transport-http` +
# `catalog-publication`) — unchanged from before the wasm split.
[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
vgi = { workspace = true, features = ["sqlite", "transport-http", "blob-vendor", "catalog-publication"] }
vgi-rpc = { workspace = true, features = ["http", "stream-codec"] }
env_logger = "0.11"

# --- wasm32 ---------------------------------------------------------------
# No sqlite (C) and no HTTP transport (tokio/mio/axum); the bincode stream codec
# is what the SAB byte-channel transport needs. No env_logger (the browser build
# has no stderr logger init).
[target.'cfg(target_arch = "wasm32")'.dependencies]
vgi = { workspace = true }
vgi-rpc = { workspace = true, features = ["stream-codec"] }
