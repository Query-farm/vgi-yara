[package]
name = "yara-wasm"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
repository.workspace = true
description = "Browser (emscripten) build of the yara VGI worker, served over a SharedArrayBuffer channel"
publish = false

# staticlib: emcc links this into the Web Worker module (see wasm/build.sh).
# Cargo never emits a .wasm for it directly.
[lib]
name = "yara_wasm"
crate-type = ["staticlib"]
path = "src/lib.rs"

[dependencies]
yara-worker = { path = "../yara-worker" }
vgi = { workspace = true }

# yara-x 1.23.0 does not compile against wasm-bindgen 0.2.130, whose closures
# gained an UnwindSafe bound that yara-x's browser runtime doesn't meet
# (yara-x src/wasm/runtime/browser.rs). Pin the versions yara-x itself locks
# until a yara-x release builds with newer wasm-bindgen.
[target.'cfg(target_family = "wasm")'.dependencies]
wasm-bindgen = "=0.2.129"
js-sys = "=0.3.106"
